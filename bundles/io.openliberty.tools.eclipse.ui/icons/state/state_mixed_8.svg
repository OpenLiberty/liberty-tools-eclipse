<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="8" height="8"
     viewBox="0 0 8 8">
  <defs>
    <!-- Linear gradient along top-left → bottom-right diagonal,
         matching the PNG renderer's (-dx - dy) brightness ramp. -->
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f7cf23"  stop-opacity="1"/>
      <stop offset="100%" stop-color="#f0a000" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <!-- Outline ring in a darker shade of the fill colour. -->
  <circle cx="4.0" cy="4.0" r="3.50" fill="#845800"/>
  <!-- Coloured fill with top-left brightness gradient -->
  <circle cx="4.0" cy="4.0" r="2.75"
          fill="url(#g)"/>
</svg>
